// The Android app around a CherryEngine game: one generic template for every project.
// Tools/Android/Package.ps1 builds the native library and stages the game's files, then runs
// Gradle with -P properties naming them (see app/build.gradle).
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = 'CherryGame'
include ':app'
